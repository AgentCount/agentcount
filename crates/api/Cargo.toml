# The `api` crate is a BINARY: the axum web server. It's the only crate the
# outside world talks to. It reads from Postgres and serves a JSON API.

[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true }

# The web framework.
axum = { workspace = true }

# Timeout layer for the public API. `tower` provides the in-flight concurrency
# limit.
tower-http = { workspace = true }
tower = { workspace = true }

# Postgres reads.
sqlx = { workspace = true }

# JSON request/response bodies.
serde = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# A path dependency on the pure conformance-checks library — not for running
# checks (only the sweeper does that), but so `/api/methodology` can publish
# the exact provenance constants and rung-4 required-field list the checker
# itself uses, rather than restating them and risking drift.
checks = { path = "../checks" }
