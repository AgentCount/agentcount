# The `api` crate is a BINARY: the axum web server. It's the only crate the
# outside world talks to. It reads from Postgres, serves a JSON API, and renders
# server-side HTML with askama.

[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true }

# The web framework.
axum = { workspace = true }

# Serves the static stylesheet from ../../frontend via ServeDir; timeout layer
# for the public API. `tower` provides the in-flight concurrency limit.
tower-http = { workspace = true }
tower = { workspace = true }

# Postgres reads.
sqlx = { workspace = true }

# JSON request/response bodies.
serde = { workspace = true }
serde_json = { workspace = true }

# Server-rendered HTML templates (files live in ../../frontend; see askama.toml).
askama = { workspace = true }

anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# A path dependency on our own pure library. The API assembles SQL aggregates
# into its input structs and lets it decide the phrasing of every published
# fact — the one place a measurement becomes a claim.
facts = { path = "../facts" }
