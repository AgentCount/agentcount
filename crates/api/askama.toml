# askama configuration for the `api` crate.
#
# By default askama looks for templates in a `templates/` folder next to the
# crate's Cargo.toml. Our HTML lives at the repo root in `frontend/` instead
# (so the templates aren't buried inside one crate), so we point askama there.
#
# Paths are resolved relative to THIS crate's root (crates/api/), which is why we
# climb two directories up to reach the workspace-root `frontend/`.
[general]
dirs = ["../../frontend"]
