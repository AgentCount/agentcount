# The `scoring` crate is a LIBRARY (it has a src/lib.rs, not a src/main.rs).
# It is deliberately pure: it takes plain data in and returns a score out, with
# zero I/O — no database, no network, no clock. That purity is what makes it
# trivially unit-testable and is the whole reason it lives in its own crate.

[package]
name = "scoring"        # rename to `ledgerscope-scoring` before publishing;
version = "0.1.0"       # `scoring` is too generic a name for crates.io.
edition = "2024"

[dependencies]
# serde: so scores can be turned into JSON by the `api` crate. The scoring crate
# itself never does the serializing — it just derives the ability.
serde = { workspace = true }

# thiserror: this is a library, so callers deserve a precise, matchable error
# type rather than an opaque string. (anyhow is for binaries; not here.)
thiserror = { workspace = true }

# chrono: we reason about agent age and activity spread over time.
chrono = { workspace = true }

# uuid: cluster ids travel with an agent on `ClusterInfo`. We don't generate
# them here (the enricher does), but we carry the type, so we depend on it.
uuid = { workspace = true }

[dev-dependencies]
# `[dev-dependencies]` are only compiled for tests/benches/examples, never for
# the shipped library. Nothing here yet — but this is where a property-testing
# crate like `proptest` would go when you test the scoring math.
