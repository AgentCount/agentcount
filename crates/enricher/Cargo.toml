# The `enricher` crate is a BINARY. It reads the agents the indexer discovered
# and adds observed reality: is the endpoint alive (an HTTP 402 counts — that's
# the x402 "alive and payable" signal)? what does its agent-card say (archived
# as an append-only snapshot)? and it raises evidence-backed coordination flags.

[package]
name = "enricher"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true }

# The HTTP client used to fetch agent-card metadata and probe endpoints.
reqwest = { workspace = true }

# Bounded-concurrency probing (buffer_unordered).
futures = { workspace = true }

# Postgres reads (agents) and writes (enrichment, clusters, scores).
sqlx = { workspace = true }

# Parse the JSON agent-card documents we fetch.
serde = { workspace = true }
serde_json = { workspace = true }

# Binary → anyhow for easy error bubbling.
anyhow = { workspace = true }

chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# SSRF guard: the domains we probe are attacker-controlled on-chain data.
url = { workspace = true }

# sha256 content hashes for archived metadata snapshots.
sha2 = { workspace = true }

[dev-dependencies]
# Local mock HTTP server so observation tests never touch the network.
wiremock = { workspace = true }
