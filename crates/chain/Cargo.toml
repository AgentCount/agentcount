[package]
name = "chain"
version = "0.1.0"
edition = "2024"

# Contract reads and nothing else. No database, no HTTP beyond JSON-RPC, no
# check logic — so `crates/checks` can stay pure and this can be swapped for a
# mock in tests.
[dependencies]
alloy = { workspace = true }
anyhow = { workspace = true }
# Exactly one RPC method is called as raw JSON rather than through alloy's
# typed API: `eth_getTransactionByHash`, read for its `from` field alone. See
# `registry::tx_sender` for why a typed decode of the whole transaction is the
# wrong tool for that job on a chain that has its own transaction types.
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
