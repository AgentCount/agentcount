# Pinning every action to a commit SHA (see the workflows) removes the
# supply-chain risk of a mutable tag, but replaces it with staleness: a pinned
# SHA never picks up a security fix on its own. Dependabot is the other half of
# that trade — it opens a PR with the new immutable SHA when one ships.
#
# Without this, "pinned" quietly becomes "abandoned".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
