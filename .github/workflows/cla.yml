name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: cla-signed
    runs-on: ubuntu-latest
    # Only react to the signature phrase or to pull request events — not to
    # every comment on every issue.
    if: >
      (github.event.issue.pull_request
        && github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
      || github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          # Only the built-in token. Note this workflow uses
          # `pull_request_target`, which runs with repository write access and
          # a token — so it must never check out or execute the pull request's
          # code. It does not: the action only reads event metadata and writes
          # a signature file.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A fine-grained PAT with contents:write on the signature repo only.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/AgentCount/agentcount/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot]'
          remote-organization-name: 'AgentCount'
          remote-repository-name: 'cla-signatures'
