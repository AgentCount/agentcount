name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: cla-signed
    runs-on: ubuntu-latest
    # Only react to the signature phrase or to pull request events — not to
    # every comment on every issue.
    # Only external contributors need a CLA. A pull request from a branch in
    # THIS repository is the maintainer's or Dependabot's, and neither signs
    # anything — running the action for them just fails noisily and, worse,
    # trains everyone to ignore a red CLA check.
    #
    # `head.repo.full_name != github.repository` is the fork test. It is used
    # here only to DECIDE WHETHER TO RUN — never interpolated into a shell
    # command, which is the injection risk that makes `pull_request_target`
    # dangerous.
    if: >
      (github.event.issue.pull_request
        && github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
      || (github.event_name == 'pull_request_target'
          && github.event.pull_request.head.repo.full_name != github.repository)
    steps:
      - name: CLA Assistant
        # Pinned to a commit SHA, not the `v2.6.1` tag. A git tag is mutable —
        # whoever controls the action's repo can repoint it — and this is the
        # worst workflow in the project to leave unpinned: `pull_request_target`
        # gives it repository write access, `pull-requests: write`,
        # `statuses: write`, and a PAT for the signatures repo, on an event any
        # stranger can trigger by opening a PR. Dependabot (.github/dependabot.yml)
        # opens a PR when a newer immutable SHA ships.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          # Only the built-in token. Note this workflow uses
          # `pull_request_target`, which runs with repository write access and
          # a token — so it must never check out or execute the pull request's
          # code. It does not: the action only reads event metadata and writes
          # a signature file.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A fine-grained PAT with contents:write on the signature repo only.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/AgentCount/agentcount/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot]'
          remote-organization-name: 'AgentCount'
          remote-repository-name: 'cla-signatures'
