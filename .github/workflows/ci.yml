name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07-31
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07-31
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07-31
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --workspace

  # ── The gate that is not a formality ──────────────────────────────────────
  #
  # crates/checks is the only place a verdict is formed, and it is pure: plain
  # data in, a status plus evidence out. That purity is what lets a verdict be
  # re-derived from an archived run without re-reading the chain — which is in
  # turn what lets a correction be measured against an old run instead of
  # guessed at.
  #
  # A single `reqwest` or `SystemTime::now()` in this crate would end that
  # quietly: nothing would fail, results would simply stop being reproducible,
  # and nobody would notice until a recount disagreed with a published number.
  # Hence a named job rather than a comment in Cargo.toml.
  checks-purity:
    name: checks-purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07-31

      - name: crates/checks has no I/O or clock dependency
        run: |
          set -euo pipefail
          # Transitive dependency tree of the checks crate only.
          cargo tree -p checks --edges normal --prefix none \
            | awk '{print $1}' | sort -u > /tmp/checks-deps.txt
          echo "--- crates/checks depends on ---"
          cat /tmp/checks-deps.txt

          banned='^(reqwest|hyper|sqlx|tokio|tokio-postgres|ureq|curl|surf|isahc|async-std|mio|socket2)$'
          if grep -Eq "$banned" /tmp/checks-deps.txt; then
            echo "::error::crates/checks gained an I/O dependency:"
            grep -E "$banned" /tmp/checks-deps.txt
            echo "A check must stay re-derivable from an archived run. See CONTRIBUTING.md."
            exit 1
          fi

      - name: crates/checks reads no clock
        run: |
          set -euo pipefail
          # `now` is a parameter to every check, never a call. A check that
          # reads the clock returns a different answer tomorrow for the same
          # archived input, which is the same failure as an I/O dependency.
          if grep -rnE '(SystemTime::now|Instant::now|Utc::now|Local::now)' \
               crates/checks/src --include='*.rs'; then
            echo "::error::crates/checks reads the clock; pass `now` in as a parameter instead."
            exit 1
          fi
          echo "no clock reads in crates/checks"

      - name: checks does not reach the filesystem
        run: |
          set -euo pipefail
          if grep -rnE 'std::fs|File::(open|create)|include_str!|env::var' \
               crates/checks/src --include='*.rs'; then
            echo "::error::crates/checks touches the filesystem or environment."
            exit 1
          fi
          echo "no filesystem or env access in crates/checks"

  # ── Every published download link still downloads ─────────────────────────
  #
  # `published-runs.json` is the census's index: publishing a run means adding
  # a row here, and every archive link the site renders is built from it. The
  # documented recipe in DATA.md pointed at `data.agentcount.ai` for weeks
  # while that hostname resolved to nothing, and nothing failed — because no
  # test had ever fetched one.
  #
  # So this fetches them. HEAD, both files, every published run, on every PR.
  # It is the cheapest possible expression of the claim the project makes:
  # a number you cannot download the evidence for is a number you have to
  # take on trust.
  archives-resolve:
    name: archives-resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: every archive in published-runs.json returns 200
        run: |
          set -euo pipefail
          host=$(grep -oE 'https://[^"]*/runs/' DATA.md | head -1)
          [ -n "$host" ] || { echo "::error::no archive host found in DATA.md"; exit 1; }
          echo "host: $host"

          fail=0
          while read -r run; do
            for ext in .tar.zst .tar.zst.sha256; do
              url="${host}${run}${ext}"
              code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 2 --max-time 30 -I "$url")
              if [ "$code" = "200" ]; then
                echo "  200  $run$ext"
              else
                echo "::error::$code for $url"
                fail=1
              fi
            done
          done < <(python3 -c "import json;[print(r['run_id']) for r in json.load(open('published-runs.json'))]")

          [ "$fail" -eq 0 ] || { echo "::error::a published archive URL does not resolve"; exit 1; }

  # ── No per-agent query may omit `chain` ───────────────────────────────────
  #
  # See scripts/check-chain-predicates.py for the measurements. Short version:
  # `chain` sits between `run_id` and `agent_id` in every per-run key, so a
  # predicate that skips it scans the whole run. Six queries were written that
  # way before anyone noticed, because the column is redundant and leaving it
  # out looks tidy. Two of them shipped and broke the site.
  chain-predicates:
    name: chain-predicates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check-chain-predicates.py
